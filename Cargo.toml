[workspace]
members = ["crates/vault-types", "crates/vault-store", "crates/vault-canister", "crates/kinic-sqlite-compat"]
resolver = "2"

[workspace.dependencies]
candid = "0.10.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ic-sqlite-vfs = { git = "https://github.com/humandebri/ic-sqlite-vfs", rev = "a3a454ff749c5be59b00725ced7ede5ac200496f", default-features = false }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"

[patch.crates-io]
passkey-auth = { path = "vendor/passkey-auth" }
